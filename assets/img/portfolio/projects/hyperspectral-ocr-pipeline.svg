<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Historical hyperspectral paper digitization workflow</title><desc id="desc">Legacy scanned papers are enhanced, parsed with OCR, structured, and indexed for research use.</desc>
