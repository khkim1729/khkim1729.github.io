  <rect width="1200" height="675" rx="32" fill="url(#bg)"/><text x="65" y="88" fill="#fff" font-family="Arial,sans-serif" font-size="40" font-weight="700">Historical Hyperspectral Research Digitization</text><text x="65" y="130" fill="#c9c7ef" font-family="Arial,sans-serif" font-size="21">Turning low-quality scientific scans into searchable structured knowledge</text>
