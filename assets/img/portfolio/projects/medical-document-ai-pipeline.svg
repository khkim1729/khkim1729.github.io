<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Medical Document AI and de-identification pipeline</title><desc id="desc">Medical files pass through preprocessing, OCR and layout analysis, VLM extraction, PII detection, redaction, and validated JSON output.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#e7f7f2"/></linearGradient><filter id="s"><feDropShadow dy="8" stdDeviation="9" flood-opacity=".13"/></filter></defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/><text x="60" y="82" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#14344d">Medical Document AI &amp; De-identification</text><text x="60" y="122" font-family="Arial,sans-serif" font-size="21" fill="#58778d">Privacy-aware extraction from heterogeneous clinical and insurance documents</text>
  <g font-family="Arial,sans-serif" text-anchor="middle" filter="url(#s)">
    <g transform="translate(45 235)"><rect width="155" height="165" rx="18" fill="#fff"/><text x="77" y="58" font-size="36">📄</text><text x="77" y="100" font-size="19" font-weight="700" fill="#183d56">Upload</text><text x="77" y="128" font-size="14" fill="#688092">PDF · Image</text></g>
    <g transform="translate(235 235)"><rect width="155" height="165" rx="18" fill="#e9f5ff"/><text x="77" y="58" font-size="32">OCR</text><text x="77" y="100" font-size="18" font-weight="700" fill="#183d56">Layout</text><text x="77" y="128" font-size="14" fill="#688092">Text + bbox</text></g>
    <g transform="translate(425 235)"><rect width="155" height="165" rx="18" fill="#eeeaff"/><text x="77" y="58" font-size="32">VLM</text><text x="77" y="100" font-size="18" font-weight="700" fill="#183d56">Extraction</text><text x="77" y="128" font-size="14" fill="#688092">Schema fields</text></g>
    <g transform="translate(615 235)"><rect width="155" height="165" rx="18" fill="#fff0f1"/><text x="77" y="58" font-size="32">PII</text><text x="77" y="100" font-size="18" font-weight="700" fill="#183d56">Detection</text><text x="77" y="128" font-size="14" fill="#688092">Rules + NER</text></g>
    <g transform="translate(805 235)"><rect width="155" height="165" rx="18" fill="#fff7e2"/><text x="77" y="58" font-size="34">▰</text><text x="77" y="100" font-size="18" font-weight="700" fill="#183d56">Redaction</text><text x="77" y="128" font-size="14" fill="#688092">PDF · Image</text></g>
    <g transform="translate(995 235)"><rect width="155" height="165" rx="18" fill="#e8f8ef"/><text x="77" y="58" font-size="32">{ }</text><text x="77" y="100" font-size="18" font-weight="700" fill="#183d56">Validated</text><text x="77" y="128" font-size="14" fill="#688092">JSON + review</text></g>
  </g>
  <g stroke="#42a98b" stroke-width="5"><path d="M205 318h25M395 318h25M585 318h25M775 318h25M965 318h25"/></g>
  <rect x="160" y="485" width="880" height="82" rx="18" fill="#173d55"/><text x="600" y="520" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">FastAPI · Docker · PostgreSQL · Redis · Celery</text><text x="600" y="550" text-anchor="middle" fill="#aee4d5" font-family="Arial,sans-serif" font-size="17">PaddleOCR · LayoutLMv3 · Qwen2.5-VL · Presidio · OpenCV</text>
</svg>
