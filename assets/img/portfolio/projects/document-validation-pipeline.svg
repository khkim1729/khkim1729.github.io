<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Lightweight document validation pipeline</title><desc id="desc">A generic public pipeline validates file integrity, document format, OCR text, rules, and produces a review report.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0f2237"/><stop offset="1" stop-color="#1b4d58"/></linearGradient><filter id="s"><feDropShadow dy="8" stdDeviation="8" flood-opacity=".24"/></filter></defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/><text x="60" y="88" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#fff">Lightweight Document Validation</text><text x="60" y="130" font-family="Arial,sans-serif" font-size="21" fill="#bfe2e6">A compact prototype for file, format, text, and rule-level checks</text>
  <g font-family="Arial,sans-serif" text-anchor="middle" filter="url(#s)">
    <g transform="translate(45 245)"><rect width="180" height="155" rx="20" fill="#fff"/><text x="90" y="55" font-size="34">01</text><text x="90" y="94" font-size="20" font-weight="700" fill="#17364b">Document Intake</text><text x="90" y="123" font-size="14" fill="#647b8b">PDF · PPT · Image</text></g>
    <g transform="translate(275 245)"><rect width="180" height="155" rx="20" fill="#e9f5ff"/><text x="90" y="55" font-size="34">02</text><text x="90" y="94" font-size="19" font-weight="700" fill="#17364b">File &amp; Format</text><text x="90" y="123" font-size="14" fill="#647b8b">Type · size · structure</text></g>
    <g transform="translate(505 245)"><rect width="180" height="155" rx="20" fill="#eeeaff"/><text x="90" y="55" font-size="34">03</text><text x="90" y="94" font-size="19" font-weight="700" fill="#17364b">OCR &amp; Text</text><text x="90" y="123" font-size="14" fill="#647b8b">Characters · required fields</text></g>
    <g transform="translate(735 245)"><rect width="180" height="155" rx="20" fill="#fff4df"/><text x="90" y="55" font-size="34">04</text><text x="90" y="94" font-size="19" font-weight="700" fill="#17364b">Rule Checks</text><text x="90" y="123" font-size="14" fill="#647b8b">Layout · values · consistency</text></g>
    <g transform="translate(965 245)"><rect width="180" height="155" rx="20" fill="#e8f8ef"/><text x="90" y="55" font-size="34">05</text><text x="90" y="94" font-size="19" font-weight="700" fill="#17364b">Review Report</text><text x="90" y="123" font-size="14" fill="#647b8b">Pass · warn · resolve</text></g>
  </g>
  <g stroke="#7ee0d0" stroke-width="5"><path d="M230 322h40M460 322h40M690 322h40M920 322h40"/></g>
  <text x="600" y="520" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#d5eff0">Transparent checks · traceable evidence · human review</text><text x="600" y="565" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#94c8cd">Public portfolio illustration — no confidential screens or source materials</text>
</svg>
