<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Portfolio renderer test</title></head>
<body>
  <div class="cv-download-wrap">
    <a data-cv-download="en" href="https://drive.google.com/drive/folders/1U5ENrltXZDs5EobbmH_y6YenByKtdjZx?usp=sharing" target="_blank" rel="noopener noreferrer"></a>
    <a data-cv-download="ko" href="https://drive.google.com/drive/folders/1UPX3vLzKza-hmvgMHZKkdo47UIrC-MHz?usp=sharing" target="_blank" rel="noopener noreferrer"></a>
  </div>
  <section data-portfolio-cv data-section-filter="research,highlights,patents,lectures,volunteering" data-section-exclude="lectures"></section>
  <section data-portfolio-publications>
    <input data-publication-search type="search">
    <p data-publication-count aria-live="polite"></p>
    <div data-publication-list></div>
  </section>
  <div data-portfolio-media-modal role="dialog" aria-modal="true" hidden>
    <button type="button" data-portfolio-media-close>Close</button>
    <img data-portfolio-media-image alt="">
    <span data-portfolio-media-caption></span>
  </div>
  <script>sessionStorage.clear(); window.PORTFOLIO_API_URL = '';</script>
  <script src="/assets/js/portfolio-data.js"></script>
</body>
</html>
